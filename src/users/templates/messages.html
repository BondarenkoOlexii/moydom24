{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content-wrapper" style="min-height: 1026.88px;">
    <section class="content-header">
        <h1>Сообщения</h1>

        <ul class="breadcrumb">
            <li><a href="/admin/"><i class="fa fa-home"></i> Главная</a></li>
            <li class="active">Сообщения</li>
        </ul>
    </section>

    <section class="content">

        <div class="row">
            <div class="col-xs-12">
                <div class="pull-right margin-bottom">
                    <a class="btn btn-success" href="/admin/message/create">Отправить сообщение</a>
                </div>
            </div>
        </div>

        <div class="box">
            <div class="box-header with-border">
                <h3 class="box-title"></h3>

                <div class="box-tools pull-right">
                    <div class="has-feedback">
                        <form action="" method="get">
                            <input type="text" name="search" value="" class="form-control input-sm" placeholder="Поиск">
                            <span class="glyphicon glyphicon-search form-control-feedback"></span>
                        </form>
                    </div>
                </div>
            </div>

            <div class="box-body no-padding">
                <div id="w0" class="grid-view">
                    <div class="mailbox-controls">
                            <button type="button" class="btn btn-default btn-sm checkbox-toggle"><i class="fa fa-square-o"></i></button>
                            <button type="button" class="btn btn-default btn-sm delete-many"><i class="fa fa-trash-o"></i></button>
                            <div class="pull-right"></div>
                    </div>
                </div>

                <div class="table-responsive mailbox-messages">
                    <table class="table table-hover table-striped linkedRow">
                        <thead>
                            <tr>
                                <th>&nbsp;</th>
                                <th style="min-width: 200px">Получатели</th>
                                <th>Текст</th>
                                <th style="width: 135px; min-width: 135px">Дата</th>
                            </tr>
                        </thead>

                        <tbody>
                        {% for item in messages %}
                            <tr data-href="{% url 'specific_message' item.id %}">
                                <td> </td>
                                <td> </td>
                                <td>{{ item.theme }}{{ item.text }}</td>
                                <td>{{ item.date }}</td>
                            </tr>
                        {% endfor %}
                        </tbody>

                    </table>
                </div>

                <div class="mailbox-controls">
                    <button type="button" class="btn btn-default btn-sm checkbox-toggle"><i class="fa fa-square-o"></i></button>
                    <button type="button" class="btn btn-default btn-sm delete-many"><i class="fa fa-trash-o"></i></button>
                    <div class="pull-right"></div>
                </div>
            </div>
        </div>
    </section>
</div>

{% endblock %}
