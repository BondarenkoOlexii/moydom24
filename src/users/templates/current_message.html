{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content-wrapper" style="min-height: 1026.88px;">
    <section class="content-header">
        <h1>Сообщение</h1>

        <ul class="breadcrumb">
          <li><a href="/admin/"><i class="fa fa-home"></i> Главная</a></li>
          <li><a href="/admin/message/index">Сообщения</a></li>
          <li class="active">Сообщение</li>
        </ul>
    </section>

    <section class="content">

        <div class="box">
            <div class="box-body no-padding">
                <div class="mailbox-read-info">
                    <h3>{{view.theme}}</h3>
                    <h5>От: Nana Nanovna<span class="mailbox-read-time pull-right">{{view.date}}</span>
                    </h5>
                </div>

                <div class="mailbox-read-message">
                    <p>{{ view.text }}</p>
                </div>
            </div>

            <div class="box-footer">
                <a href="{% url 'delete_message' item.id %}" data-confirm="Удалить?" data-method="post">
                    <button type="button" class="btn btn-default"><i class="fa fa-trash-o"></i> Удалить</button>
                </a>
            </div>

        </div>
    </section>
</div>

{% endblock %}
