{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content-wrapper" style="min-height: 1024.88px;">
    <section class="content-header">
        <h1> Пригласить владельца квартир </h1>
        <ul class="breadcrumb">
            <li><a href="/admin/"><i class="fa fa-home"></i> Главная</a></li>
            <li><a href="/admin/user/index">Владельцы квартир</a></li>
            <li class="active">Пригласить владельца квартир</li>
        </ul>
    </section>


    <section class="content">
        <div class="box">

            <div class="box-header with-border">
                <h3 class="box-title">Отправить приглашение</h3>
            </div>

            <div class="box-body">
                <form id="w0" method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-xs-12 col-sm-6">
                            <div class="form-group field-email">
                                <label class="control-label" for="email">Email</label>
                                {{ form.email }}
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-xs-12 text-center">
                                <div class="form-group">
                                    <button type="submit" class="btn btn-success">Отправить приглашение</button>
                                </div>
                            </div>
                        </div>
                </form>
            </div>
        </div>
    </section>
</div>

{% endblock %}
