{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content-wrapper" style="min-height: 1013.88px;">
    <section class="content-header">
        <h1>Новая статья</h1>

        <ul class="breadcrumb">
            <li><a href="/admin/"><i class="fa fa-home"></i> Главная</a></li>
            <li><a href="/admin/transaction-purpose/index">Статьи приходов/расходов</a></li>
            <li class="active">Новая статья</li>
        </ul>
    </section>

    <section class="content">
        <div class="box">
            <div class="box-body">
                <form id="w0" method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-xs-12 col-lg-7">
                            <div class="form-group field-transactionpurpose-name required">
                                <label class="control-label" for="transactionpurpose-name">Название</label>
                                {{ form.name }}
                                <div class="help-block"></div>
                            </div>

                            <div class="form-group field-transactionpurpose-type">
                                <label class="control-label" for="transactionpurpose-type">Приход/расход</label>
                                {{ form.type }}
                                <div class="help-block"></div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12 text-right">
                            <div class="form-group">
                                <a href="/admin/transaction-purpose/index" class="btn btn-default">Отменить</a>
                                <button type="submit" class="btn btn-success">Сохранить</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

{% endblock %}
