{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content-wrapper" style="min-height: 1024.88px;">
    <section class="content-header">
        <h1>Платежные реквизиты</h1>

    </section>

    <section class="content">
        <div class="box">
            <div class="box-body">
                <form id="w0"  method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-xs-12 col-lg-7">
                            <div class="nav-tabs-custom">
                                <div class="tab-content">
                                    <div class="tab-pane clearfix active">
                                        <div id="form-paycompany-rows">
                                            <div id="form-paycompany-0" class="row form-paycompany margin-bottom-15">
                                                <div class="col-xs-12">
                                                    <input type="hidden" id="paycompany-0-id" name="PayCompany[0][id]" value="1">
                                                    <div class="form-group">
                                                        <label for="paycompany-0-name">Название компании</label>
                                                        {{ form.name }}
                                                    </div>

                                                    <div class="form-group">
                                                        <label for="paycompany-0-description">Информация</label>
                                                        {{ form.information }}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12 text-center">
                            <div class="form-group">
                                <a href="/admin/pay-company/index" class="btn btn-default">Отменить</a>
                                <button type="submit" class="btn btn-success">Сохранить</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

{% endblock %}
