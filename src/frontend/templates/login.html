{% load static %}

<!DOCTYPE html>
<html lang="ru-RU" style="height: auto; min-height: 100%;">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
        <link rel="icon" type="image/png" href="https://myhouse24.demodev.cc/favicon.png">
        <meta name="csrf-param" content="_csrf-cabinet">
        <meta name="csrf-token" content="HMxZHmEuVynX3YZ0KrBydSlTzAK3x2uDJv4JeNNdn68liTR5E187RbLkvll10xcFeQeHL-HyIvFFyT5Bugv03g==">
        <title>Вход</title>
        <link href="{% static 'dist/css/bootstrap.min.css' %}" rel="stylesheet">
        <link href="{% static 'dist/css/bootstrap-datepicker.min.css' %}" rel="stylesheet">
        <link href="{% static 'dist/css/font-awesome.min.css' %}" rel="stylesheet">
        <link href="{% static 'dist/css/ionicons.min.css' %}" rel="stylesheet">
        <link href="{% static 'dist/css/jquery-jvectormap.css' %}" rel="stylesheet">
        <link href="{% static 'dist/css/AdminLTE.min.css' %}" rel="stylesheet">
        <link href="{% static 'dist/css/blue.css' %}" rel="stylesheet">
        <link href="{% static 'dist/css/bootstrap3-wysihtml5.min.css' %}" rel="stylesheet">
        <link href="{% static 'dist/css/_all-skins.min.css' %}" rel="stylesheet">
        <link href="{% static 'dist/css/style.css' %}" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic" rel="stylesheet">
        <link href="{% static 'dist/css/custom.css' %}" rel="stylesheet"><style type="text/css">.jqstooltip { position: absolute;left: 0px;top: 0px;visibility: hidden;background: rgb(0, 0, 0) transparent;background-color: rgba(0,0,0,0.6);filter:progid:DXImageTransform.Microsoft.gradient(startColorstr=#99000000, endColorstr=#99000000);-ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr=#99000000, endColorstr=#99000000)";color: white;font: 10px arial, san serif;text-align: left;white-space: nowrap;padding: 5px;border: 1px solid white;box-sizing: content-box;z-index: 10000;}.jqsfield { color: white;font: 10px arial, san serif;text-align: left;}</style>
    </head>
    <body class="login-page" style="height: auto; min-height: 100%;">
        <div class="login-box">
            <div class="login-logo">
                <a href="https://myhouse24.demodev.cc/">
                    <img src="https://myhouse24.demodev.cc/logo.svg" alt="logo">
                </a>
            </div>
            <div class="nav-tabs-custom">
                <ul class="nav nav-tabs">
                    <li class="{% if 'cabinet' in request.path  %}active{% endif %}"><a href="{% url 'login_user_cabinet' %}">Для жильца</a></li>   <!-- data-toggle="tab" aria-expanded="true" -->
                    <li class="{% if 'adminpanel' in request.path  %}active{% endif %}"><a href="{% url 'admin_login' %}">Для администрации</a></li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane active" id="tab_1">
                        <div class="login-box-body">
                            {% if "adminpanel" in request.path  %}
                                <p class="login-box-msg">Вход в панель управления</p>
                            {% else %}
                                <p class="login-box-msg">Вход в личный кабинет</p>
                            {% endif %}

                            <form id="login-form" method="post">
                                {% csrf_token %}
                                <div class="form-group has-feedback field-loginform-username required">
                                    {{ form.username }}<span class="fa fa-envelope form-control-feedback"></span>
                                </div>
                                <div class="form-group has-feedback field-loginform-password required">
                                    {{ form.password }}<span class="fa fa-lock form-control-feedback"></span>
                                </div>
                                <div class="row">
                                    <div class="col-xs-12">
                                        <div class="checkbox icheck">
                                            <input type="hidden" name="LoginForm[rememberMe]" value="0">
                                            <label class="">
                                                <div class="icheckbox_flat-blue checked" style="position: relative;" aria-checked="false" aria-disabled="false">
                                                    {{ form.remember_me }}<ins class="iCheck-helper" style="position: absolute; top: 0%; left: 0%; display: block; width: 100%; height: 100%; margin: 0px; padding: 0px; background: rgb(255, 255, 255); border: 0px; opacity: 0;"></ins>
                                                </div>
                                                Запомнить меня
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-xs-12">
                                        <button type="submit" class="btn btn-primary btn-block" name="login-button">Вход</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <script src="{% static 'dist/js/jquery.js' %}"></script>
        <script src="{% static 'dist/js/bootstrap.min.js' %}"></script>
        <script src="{% static 'dist/js/slick.min.js' %}"></script>
        <script src="{% static 'dist/js/main.js' %}"></script>
        <script src="{% static 'dist/js/simple-lightbox.min.js' %}"></script>

    </body>
</html>
