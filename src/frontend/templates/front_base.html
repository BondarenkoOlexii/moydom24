    <style>
        .row-eq-height {

        }

            position: absolute;
            top: 50%;
            z-index: 20;
            font-size: 200px !important;
            cursor: pointer;
            color: rgba(225, 225, 225, 0.7);
            transition: 0.3s;
        }

        .custom-arrow:hover {
            color: #ffffff;
        }

        .slick-prev.custom-arrow {
            left: 20px;
        }

        .slick-next.custom-arrow {
            right: 20px;
        }

        .slick-dots {
            position: absolute;
            bottom: 20px;
            list-style: none;
            display: flex !important;
            justify-content: center;
            width: 100%;
            padding: 0;
            margin: 0;
