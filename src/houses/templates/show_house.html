{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content-wrapper" style="min-height: 362.883px;">
    <section class="content-header">
        <h1>доммммм</h1>
        <ul class="breadcrumb">
          <li><a href="/admin/"><i class="fa fa-home"></i> Главная</a></li>
          <li><a href="/admin/house/index">Дома</a></li>
          <li class="active">доммммм</li>
        </ul>
    </section>

    <section class="content">

        <div class="box">
            <div class="box-header with-border">
                <h3 class="box-title"></h3>
                <div class="box-tools">
                    <a href="" class="btn btn-primary btn-sm">
                        <span class="hidden-xs">Редактировать дом</span><i class="fa fa-pencil visible-xs" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-xs-12 col-lg-4">
                        <table class="table table-bordered table-striped table-view">
                            <tbody>
                                <tr>
                                    <td>Название</td>
                                    <td>{{ house.name }}</td>
                                </tr>
                                <tr>
                                    <td>Адрес</td>
                                    <td>{{ house.adress }}</td>
                                </tr>
                                <tr>
                                    <td>Секций</td>
                                    <td>{{ house.section_set }}</td>
                                </tr>
                                <tr>
                                    <td>Этажей</td>
                                    <td>{{ house.storey_set }}</td>
                                </tr>
                                                        <tr>
                                    <td>Пользователи</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="col-xs-12 col-lg-8">
                        <div class="row">
                            <div class="col-xs-12 col-md-6">
                                <img src="{% if object.image_1 %}{{ object.image_1.photo.url }}{% else %}https://myhouse24.demodev.cc/site/glide?path=%2Fupload%2Fplaceholder.jpg&amp;w=522&amp;h=350&amp;fit=crop{% endif %}" class="img-responsive largeImg margin-bottom-30" alt="">
                            </div>
                            <div class="col-xs-6 col-md-3">
                                <img src="{% if object.image_2 %}{{ object.image_2.photo.url }}{% else %}https://myhouse24.demodev.cc/site/glide?path=%2Fupload%2Fplaceholder.jpg&amp;w=522&amp;h=350&amp;fit=crop{% endif %}" class="img-responsive smallImg margin-bottom-30" alt="">
                            </div>
                            <div class="col-xs-6 col-md-3">
                                <img src="{% if object.image_3 %}{{ object.image_3.photo.url }}{% else %}https://myhouse24.demodev.cc/site/glide?path=%2Fupload%2Fplaceholder.jpg&amp;w=522&amp;h=350&amp;fit=crop{% endif %}" class="img-responsive smallImg margin-bottom-30" alt="">
                            </div>
                            <div class="col-xs-6 col-md-3">
                                <img src="{% if object.image_4 %}{{ object.image_4.photo.url }}{% else %}https://myhouse24.demodev.cc/site/glide?path=%2Fupload%2Fplaceholder.jpg&amp;w=522&amp;h=350&amp;fit=crop{% endif %}" class="img-responsive smallImg margin-bottom-30" alt="">
                            </div>
                            <div class="col-xs-6 col-md-3">
                                <img src="{% if object.image_5 %}{{ object.image_5.photo.url }}{% else %}https://myhouse24.demodev.cc/site/glide?path=%2Fupload%2Fplaceholder.jpg&amp;w=522&amp;h=350&amp;fit=crop{% endif %}" class="img-responsive smallImg margin-bottom-30" alt="">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

{% endblock %}
